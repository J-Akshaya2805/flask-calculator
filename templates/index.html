<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flask Calculator-DevOps</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #dbeafe, #ede9fe);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0;
      }

      .calculator {
        background: white;
        padding: 30px;
        border-radius: 16px;
        width: 350px;
        max-width: 92%;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      }

      h1 {
        text-align: center;
        color: #4338ca;
      }

      label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
      }

      input,
      select,
      button {
        width: 100%;
        padding: 12px;
        margin-top: 8px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 16px;
      }

      button {
        background: #4f46e5;
        color: white;
        border: none;
        cursor: pointer;
        margin-top: 22px;
      }

      button:hover {
        background: #3730a3;
      }

      .result {
        margin-top: 20px;
        padding: 12px;
        background: #dcfce7;
        color: #166534;
        border-radius: 8px;
        text-align: center;
        overflow-wrap: anywhere;
      }

      .error {
        margin-top: 20px;
        padding: 12px;
        background: #fee2e2;
        color: #991b1b;
        border-radius: 8px;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <main class="calculator">
      <h1>Python Calculator</h1>

      <form method="POST">
        <label for="num1">First Number</label>
        <input type="number" step="any" id="num1" name="num1" required />

        <label for="operation">Operation</label>
        <select id="operation" name="operation">
          <option value="add">Addition (+)</option>
          <option value="subtract">Subtraction (-)</option>
          <option value="multiply">Multiplication (*)</option>
          <option value="divide">Division (/)</option>
        </select>

        <label for="num2">Second Number</label>
        <input type="number" step="any" id="num2" name="num2" required />

        <button type="submit">Calculate</button>
      </form>

      {% if result is not none %}
      <div class="result">Result: <strong>{{ result }}</strong></div>
      {% endif %} {% if error %}
      <div class="error">{{ error }}</div>
      {% endif %}
    </main>
  </body>
</html>
